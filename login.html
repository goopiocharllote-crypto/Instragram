<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | InstaCommunity</title>
  <style>
    :root { --ink:#17202a; --muted:#687684; --pink:#e1306c; --purple:#833ab4; --line:#e1e5e9; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; color:var(--ink); background:#fafafa; font-family:Arial,sans-serif; }
    .box { width:min(390px,calc(100% - 32px)); padding:36px 32px 30px; background:#fff; border:1px solid var(--line); }
    h1 { margin:0 0 28px; text-align:center; font:700 30px Georgia,serif; letter-spacing:-1px; } label { display:block; margin:15px 0 7px; color:var(--muted); font-size:13px; }
    input { width:100%; padding:13px; border:1px solid var(--line); border-radius:6px; font:15px Arial,sans-serif; } button { width:100%; margin-top:22px; padding:13px; border:0; border-radius:6px; color:#fff; background:linear-gradient(100deg,var(--purple),var(--pink)); font-weight:700; cursor:pointer; }
    .switch { margin:25px 0 0; text-align:center; color:var(--muted); font-size:14px; } a { color:var(--purple); font-weight:700; text-decoration:none; } .home { display:block; margin-top:22px; text-align:center; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <main class="box">
    <h1>InstaCommunity</h1>
    <form action="index.html" method="get">
      <label for="email">Email or username</label><input id="email" name="email" type="text" autocomplete="username" required>
      <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
    </form>
    <p class="switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    <a class="home" href="index.html">Back to home</a>
  </main>
</body>
</html>
